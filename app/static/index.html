<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DigiPlus</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header><div><p class="eyebrow">DIGIPLUS</p><h1>Context that survives the meeting.</h1></div><button id="newMeeting">+ New meeting</button></header>
<main><section class="stats"><div><span>Open action items</span><strong id="openCount">0</strong></div><div><span>How it works</span><strong>Paste → Extract → Review</strong></div></section><section class="layout"><aside><h2>Meetings & handovers</h2><div id="meetingList"></div></aside><article id="detail"><div class="empty"><h2>Select a meeting</h2><p>Explore the seeded sample data or create a meeting and use AI to structure its transcript.</p></div></article></section></main>
<dialog id="meetingDialog"><form method="dialog" id="meetingForm"><h2>New meeting</h2><label>Title<input name="title" required minlength="3" placeholder="Weekly product sync"></label><label>Type<select name="type"><option value="meeting">Meeting</option><option value="handover">Handover</option><option value="work_transfer">Work transfer</option></select></label><label>When<input name="scheduled_at" type="datetime-local" required></label><label>Agenda<textarea name="agenda" placeholder="What should be covered?"></textarea></label><menu><button value="cancel">Cancel</button><button class="primary" value="default">Create</button></menu></form></dialog>
<script src="/static/app.js"></script></body></html>
